name: Validate MUGEN documentation

on:
  pull_request:
    branches: [master]
  push:
    branches: ['codex/mugen-schema-v2-migration']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run mugen:validate
      - run: npm run mugen:test
      - run: npm run build
      - run: npm run mugen:check-html
