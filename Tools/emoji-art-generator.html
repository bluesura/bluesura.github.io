<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Art Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-bg': '#f0f8ff',
                        'brand-primary': '#3b82f6',
                        'brand-secondary': '#10b981'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body {
            font-family: 'Poppins', 'Segoe UI', 'Noto Color Emoji', 'Apple Color Emoji', sans-serif;
        }
        #emojiArt {
            letter-spacing: 0;
            word-spacing: 0;
            line-height: 1;
            white-space: pre;
            overflow-x: auto;
            display: inline-block;
        }
    </style>
</head>
<body class="bg-brand-bg min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl bg-white shadow-2xl rounded-2xl p-8 space-y-6 transform transition-all hover:scale-[1.01]">
        <div class="text-center">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-brand-primary to-brand-secondary text-transparent bg-clip-text mb-4">
                Emoji Art Generator
            </h1>
            <p class="text-gray-600 mb-6">画像を絵文字アートに変換しよう！</p>
        </div>

        <div class="bg-gray-100 rounded-xl p-6 space-y-4">
            <div class="flex flex-col items-center">
                <label class="block mb-2 text-sm font-medium text-gray-700" for="imageInput">
                    画像をアップロード
                </label>
                <input 
                    type="file" 
                    id="imageInput" 
                    accept="image/*" 
                    class="block w-full text-sm text-gray-500 
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-full file:border-0
                    file:text-sm file:font-semibold
                    file:bg-brand-primary file:text-white
                    hover:file:bg-brand-secondary
                    cursor-pointer"
                >
            </div>

            <div class="flex items-center justify-center space-x-4">
                <label for="widthControl" class="text-sm font-medium text-gray-700">
                    出力幅: <span id="widthDisplay" class="text-brand-primary">25</span>
                </label>
                <input 
                    type="range" 
                    id="widthControl" 
                    min="10" 
                    max="100" 
                    value="25"
                    class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                >
            </div>
        </div>

        <div class="bg-gray-50 rounded-xl p-4 overflow-auto">
            <div class="flex justify-center">
                <pre id="emojiArt" class="text-xs font-mono text-center text-gray-800 tracking-tight"></pre>
            </div>
        </div>
    </div>

    <div class="mt-6 text-center text-gray-500 text-sm">
        <p>📸 画像をアップロードして、絵文字アートを作ろう！</p>
    </div>

    <script>
        // CIE L*a*b* 色空間への変換関数群
        function rgb2xyz(r, g, b) {
            r /= 255;
            g /= 255;
            b /= 255;

            // sRGB to XYZ
            r = r > 0.04045 ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
            g = g > 0.04045 ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
            b = b > 0.04045 ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;

            const x = r * 0.4124564 + g * 0.3575761 + b * 0.1804375;
            const y = r * 0.2126729 + g * 0.7151522 + b * 0.0721750;
            const z = r * 0.0193339 + g * 0.1191920 + b * 0.9503041;

            return [x, y, z];
        }

        function xyz2lab(x, y, z) {
            // D65 参照白色点
            const refX = 0.95047;
            const refY = 1.0;
            const refZ = 1.08883;

            x /= refX;
            y /= refY;
            z /= refZ;

            // XYZ to Lab 変換
            x = x > 0.008856 ? Math.pow(x, 1/3) : (7.787 * x) + (16/116);
            y = y > 0.008856 ? Math.pow(y, 1/3) : (7.787 * y) + (16/116);
            z = z > 0.008856 ? Math.pow(z, 1/3) : (7.787 * z) + (16/116);

            const L = (116 * y) - 16;
            const a = 500 * (x - y);
            const b = 200 * (y - z);

            return [L, a, b];
        }

        // RGBからLab色空間への直接変換
        function rgb2lab(r, g, b) {
            const [x, y, z] = rgb2xyz(r, g, b);
            return xyz2lab(x, y, z);
        }

        // 色相、彩度、明度の計算
        function rgb2hsv(r, g, b) {
            r /= 255;
            g /= 255;
            b /= 255;

            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            const diff = max - min;

            let h = 0;
            const v = max;
            const s = max === 0 ? 0 : diff / max;

            if (diff === 0) {
                h = 0;
            } else {
                switch (max) {
                    case r: h = (g - b) / diff + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / diff + 2; break;
                    case b: h = (r - g) / diff + 4; break;
                }
                h /= 6;
            }

            return [h, s, v];
        }

        // CIE Delta E (1976) 色差計算
        function calculateDeltaE(lab1, lab2) {
            const [L1, a1, b1] = lab1;
            const [L2, a2, b2] = lab2;

            return Math.sqrt(
                Math.pow(L1 - L2, 2) +
                Math.pow(a1 - a2, 2) +
                Math.pow(b1 - b2, 2)
            );
        }

        // カラーヒストグラムを生成
        function generateColorHistogram(imageData, outputWidth, outputHeight) {
            const colorBins = {};
            
            for (let i = 0; i < outputHeight; i++) {
                for (let j = 0; j < outputWidth; j++) {
                    const index = (i * outputWidth + j) * 4;
                    const r = imageData[index];
                    const g = imageData[index + 1];
                    const b = imageData[index + 2];
                    const a = imageData[index + 3];
                    
                    // 透明ピクセルは無視
                    if (a === 0) continue;

                    const [h, s, v] = rgb2hsv(r, g, b);
                    
                    // 色相を丸めて、色のビンを作成
                    const binKey = `${Math.round(h * 12)},${Math.round(s * 10)},${Math.round(v * 10)}`;
                    colorBins[binKey] = (colorBins[binKey] || 0) + 1;
                }
            }

            return colorBins;
        }

        // 絵文字の色定義（Lab色空間）
        const emojiColorsLab = {
            "🟥": rgb2lab(255, 0, 0),     // 赤
            "🟧": rgb2lab(255, 165, 0),   // オレンジ
            "🟨": rgb2lab(255, 255, 0),   // 黄
            "🟩": rgb2lab(0, 255, 0),     // 緑
            "🟦": rgb2lab(0, 0, 255),     // 青
            "🟪": rgb2lab(128, 0, 128),   // 紫
            "⬛": rgb2lab(0, 0, 0),       // 黒
            "⬜": rgb2lab(255, 255, 255), // 白
            "🩷": rgb2lab(255, 145, 175), // ピンク
            "🩵": rgb2lab(137, 207, 240), // 水色
            "🩶": rgb2lab(169, 169, 169), // グレー
            "🟤": rgb2lab(139, 69, 19),   // 茶色
            "🔴": rgb2lab(255, 0, 0),     // 赤丸
            "🟠": rgb2lab(255, 165, 0),   // オレンジ丸
            "🟡": rgb2lab(255, 255, 0),   // 黄丸
            "🟢": rgb2lab(0, 255, 0),     // 緑丸
            "🔵": rgb2lab(0, 0, 255),     // 青丸
            "🟣": rgb2lab(128, 0, 128)    // 紫丸
        };

        // 各絵文字の色のHSV特性
        const emojiColorsHSV = {
            "🟥": rgb2hsv(255, 0, 0),
            "🟧": rgb2hsv(255, 165, 0),
            "🟨": rgb2hsv(255, 255, 0),
            "🟩": rgb2hsv(0, 255, 0),
            "🟦": rgb2hsv(0, 0, 255),
            "🟪": rgb2hsv(128, 0, 128),
            "⬛": rgb2hsv(0, 0, 0),
            "⬜": rgb2hsv(255, 255, 255),
            "🩷": rgb2hsv(255, 145, 175),
            "🩵": rgb2hsv(137, 207, 240),
            "🩶": rgb2hsv(169, 169, 169),
            "🟤": rgb2hsv(139, 69, 19),
            "🔴": rgb2hsv(255, 0, 0),
            "🟠": rgb2hsv(255, 165, 0),
            "🟡": rgb2hsv(255, 255, 0),
            "🟢": rgb2hsv(0, 255, 0),
            "🔵": rgb2hsv(0, 0, 255),
            "🟣": rgb2hsv(128, 0, 128)
        };

        function getClosestEmoji(rgb, colorHistogram) {
            const [r, g, b] = rgb;
            const pixelLab = rgb2lab(r, g, b);
            const [pixelH, pixelS, pixelV] = rgb2hsv(r, g, b);
            
            let minDistance = Infinity;
            let closestEmoji = null;
            
            for (const emoji in emojiColorsLab) {
                const emojiLab = emojiColorsLab[emoji];
                const [emojiH, emojiS, emojiV] = emojiColorsHSV[emoji];
                
                // 色差計算
                const colorDistance = calculateDeltaE(pixelLab, emojiLab);
                
                // カラーヒストグラムからの重み付け
                const [pixelHBin, pixelSBin, pixelVBin] = [
                    Math.round(pixelH * 12),
                    Math.round(pixelS * 10),
                    Math.round(pixelV * 10)
                ];
                const [emojiHBin, emojiSBin, emojiVBin] = [
                    Math.round(emojiH * 12),
                    Math.round(emojiS * 10),
                    Math.round(emojiV * 10)
                ];
                const binKey = `${pixelHBin},${pixelSBin},${pixelVBin}`;
                const histogramWeight = colorHistogram[binKey] || 0;
                
                // 彩度と明度のペナルティ
                let penaltyFactor = 1;
                
                // 白、黒、グレーのペナルティ
                if (/*emoji === "⬜" ||*/ emoji === "🟤" || emoji === "⬛" || emoji === "🩶") {
                    penaltyFactor *= 10; // より高いペナルティ
                }
                
                // 低彩度または極端な明度のペナルティ
                if (pixelS < 0.2 || pixelV < 0.2 || pixelV > 0.9) {
                    penaltyFactor *= 10;
                }
                
                // 最終的な距離計算
                const finalDistance = (colorDistance * penaltyFactor) / (1 + Math.log(histogramWeight + 1));
                
                if (finalDistance < minDistance) {
                    minDistance = finalDistance;
                    closestEmoji = emoji;
                }
            }
            
            return closestEmoji;
        }

        function createEmojiArt(imageFile, outputWidth) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const width = img.width;
                        const height = img.height;
                        const aspectRatio = height / width;
                        const outputHeight = Math.floor(outputWidth * aspectRatio);
                        
                        canvas.width = outputWidth;
                        canvas.height = outputHeight;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, outputWidth, outputHeight);
                        
                        const imageData = ctx.getImageData(0, 0, outputWidth, outputHeight).data;

                        // カラーヒストグラムの生成
                        const colorHistogram = generateColorHistogram(imageData, outputWidth, outputHeight);

                        let emojiArt = "";
                        for (let i = 0; i < outputHeight; i++) {
                            let row = "";
                            for (let j = 0; j < outputWidth; j++) {
                                const index = (i * outputWidth + j) * 4;
                                const r = imageData[index];
                                const g = imageData[index + 1];
                                const b = imageData[index + 2];
                                const a = imageData[index + 3];
                                
                                // Skip fully transparent pixels
                                if (a === 0) {
                                    row += "⬜";
                                    continue;
                                }
                                
                                const rgb = [r, g, b];
                                const emoji = getClosestEmoji(rgb, colorHistogram);
                                row += emoji;
                            }
                            emojiArt += row + "\n";
                        }
                        resolve(emojiArt);
                    };
                    img.onerror = function() {
                        reject("画像の読み込みエラー");
                    };
                    img.src = event.target.result;
                };
                reader.onerror = function() {
                    reject("ファイルの読み込みエラー");
                };
                reader.readAsDataURL(imageFile);
            });
        }

        // イベントリスナーの設定
        const imageInput = document.getElementById('imageInput');
        const emojiArtDiv = document.getElementById('emojiArt');
        const widthControl = document.getElementById('widthControl');
        const widthDisplay = document.getElementById('widthDisplay');

        // 出力幅のコントロール
        widthControl.addEventListener('input', function() {
            widthDisplay.textContent = this.value;
        });

        // 画像入力イベント
        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const outputWidth = parseInt(widthControl.value);
                
                createEmojiArt(file, outputWidth)
                    .then(emojiArtText => {
                        // サニタイズとHTMLエスケープ
                        const sanitizedText = emojiArtText
                            .replace(/&/g, '&amp;')
                            .replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;');
                        
                        emojiArtDiv.innerHTML = sanitizedText;
                    })
                    .catch(error => {
                        emojiArtDiv.textContent = `エラーが発生しました：${error}`;
                    });
            }
        });
    </script>
</body>
</html>
